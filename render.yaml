# Render Blueprint for the FitPulse API (Express + MongoDB).
# Dashboard: New > Blueprint > pick this repo. Render reads this file.
services:
  - type: web
    name: fitpulse-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # prompted for in the dashboard — never committed
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret
      - key: CORS_ORIGINS
        sync: false # set to the Vercel URL after the frontend is deployed
      - key: VAPID_PUBLIC_KEY
        sync: false # npx web-push generate-vapid-keys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@example.com
      - key: CRON_SECRET
        generateValue: true # copy it into the GitHub secret of the same name
